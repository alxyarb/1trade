<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Analytics Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { margin: 0; padding: 0; background: #05070a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .terminal { width: 90%; max-width: 400px; background: #0f1218; border: 1px solid #1f2530; border-radius: 20px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .header { font-size: 10px; color: #4e5a71; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        
        .signal-display { height: 180px; background: #07090d; border-radius: 15px; border: 1px solid #1a1f29; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; position: relative; overflow: hidden; }
        
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #00d2ff; box-shadow: 0 0 15px #00d2ff; opacity: 0; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #pair { font-size: 14px; color: #8a96ab; margin-bottom: 5px; }
        #direction { font-size: 42px; font-weight: 900; margin: 10px 0; display: none; }
        .up { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.4); }
        .down { color: #ff3d71; text-shadow: 0 0 20px rgba(255,61,113,0.4); }
        
        #time { font-size: 18px; font-weight: bold; color: #fff; display: none; }
        .status-msg { font-size: 11px; color: #00d2ff; text-transform: uppercase; font-weight: bold; }

        .btn { background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%); border: none; width: 100%; padding: 18px; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,114,255,0.3); transition: 0.3s; }
        .btn:disabled { background: #1a1f29; color: #4e5a71; box-shadow: none; }
        
        .footer-info { margin-top: 15px; font-size: 10px; color: #4e5a71; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">Neural Network Analysis v4.2</div>
    
    <div class="signal-display">
        <div class="scanner-line" id="line"></div>
        <div id="pair">EUR/USD (OTC)</div>
        <div id="direction">UP</div>
        <div id="time">5 MINUTES</div>
        <div id="status" class="status-msg">Система готова</div>
    </div>

    <button class="btn" id="mainBtn" onclick="analyze()">Получить сигнал</button>
    <div class="footer-info">Точность прогноза: 83.7%</div>
</div>

<script>
    function analyze() {
        const btn = document.getElementById('mainBtn');
        const line = document.getElementById('line');
        const status = document.getElementById('status');
        const dir = document.getElementById('direction');
        const time = document.getElementById('time');
        const pairs = ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "EUR/JPY"];

        btn.disabled = true;
        line.style.opacity = '1';
        line.style.animation = 'scan 1.5s infinite linear';
        status.innerText = "Сканирование рынка...";
        dir.style.display = 'none';
        time.style.display = 'none';
        document.getElementById('pair').innerText = pairs[Math.floor(Math.random()*pairs.length)] + " (OTC)";

        setTimeout(() => { status.innerText = "Анализ объемов..."; }, 2000);
        setTimeout(() => { status.innerText = "Поиск точки входа..."; }, 4000);

        setTimeout(() => {
            line.style.animation = 'none';
            line.style.opacity = '0';
            status.innerText = "Сигнал сформирован:";
            
            const isUp = Math.random() > 0.5;
            dir.innerText = isUp ? "ВВЕРХ ⬆️" : "ВНИЗ ⬇️";
            dir.className = isUp ? "up" : "down";
            dir.style.display = 'block';
            
            time.innerText = "СРОК: 5 МИНУТ";
            time.style.display = 'block';
            
            btn.disabled = false;
        }, 6000);
    }
</script>

</body>
</html>
