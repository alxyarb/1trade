<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Analytics Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2=family=Inter:wght@400;600;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; 
            background: #090c10; /* Дорогой равномерный темный фон */
            color: white; 
            font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; 
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        /* СТРУКТУРА ЭКРАНОВ */
        .app-container {
            width: 90%; max-width: 380px;
            text-align: center;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: opacity 0.4s ease;
        }

        .screen.active {
            display: flex;
        }
        
        /* КРУПНЫЙ ЖИРНЫЙ ЗАГОЛОВОК */
        .main-title {
            font-size: 26px; 
            font-weight: 900; 
            line-height: 1.3;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        
        /* ЭКРАН СИГНАЛА */
        .signal-display { 
            width: 100%;
            height: 200px; background: #0d1117; border-radius: 18px; 
            border: 1px solid #1f2631; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; margin-bottom: 30px; 
            position: relative; overflow: hidden; padding: 10px; box-sizing: border-box;
        }
        
        /* ЛАЗЕРНЫЙ СКАНЕР */
        .scanner-line { 
            position: absolute; top: 0; left: 0; width: 100%; height: 3px; 
            background: linear-gradient(to right, transparent, #00d2ff, transparent); 
            box-shadow: 0 0 15px #00d2ff; opacity: 0; 
        }
        @keyframes scan { 
            0% { top: 0%; } 
            50% { top: 100%; }
            100% { top: 0%; } 
        }

        /* ПРОГРЕСС БАР */
        .progress-container {
            width: 80%; height: 4px; background: #161b22; 
            border-radius: 2px; margin-top: 15px; display: none; overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #0072ff, #00d2ff);
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.15s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        #pair { font-size: 18px; font-weight: 700; color: #8a96ab; margin-bottom: 5px; }
        
        #direction { font-size: 40px; font-weight: 900; margin: 8px 0; display: none; letter-spacing: 1px; }
        .up { color: #00ff88; text-shadow: 0 0 25px rgba(0,255,136,0.5); }
        .down { color: #ff3d71; text-shadow: 0 0 25px rgba(255,61,113,0.5); }
        
        .info-row { display: none; gap: 15px; margin-top: 5px; }
        .info-box { font-size: 13px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.03); padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .profit-color { color: #00d2ff; font-weight: 700; }

        .status-msg { font-size: 12px; color: #00d2ff; text-transform: uppercase; font-weight: 700; }

        /* ПРЕМИУМ КНОПКИ */
        .btn { 
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%); 
            border: none; width: 100%; padding: 19px; border-radius: 14px; 
            color: white; font-size: 16px; font-weight: 700; cursor: pointer; 
            text-transform: uppercase; box-shadow: 0 8px 25px rgba(0,114,255,0.25); 
            transition: 0.2s; letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { 
            background: #161b22; color: #3d4758; box-shadow: none; cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="screen active" id="welcomeScreen">
        <div class="main-title">Добро пожаловать в<br>анализатор 1TRADE</div>
        <button class="btn" onclick="startApp()">Старт</button>
    </div>
    
    <div class="screen" id="terminalScreen">
        <div class="main-title">Получи сигнал<br>прямо сейчас!</div>
        
        <div class="signal-display">
            <div class="scanner-line" id="line"></div>
            <div id="pair">ОЖИДАНИЕ ЗАПУСКА</div>
            <div id="direction">ВВЕРХ ⬆️</div>
            
            <div class="info-row" id="infoRow">
                <div class="info-box">ВРЕМЯ: 5 МИН</div>
                <div class="info-box">ДОХОД: <span id="profit" class="profit-color">85%</span></div>
            </div>

            <div id="status" class="status-msg">Система готова к анализу</div>
            <div class="progress-container" id="pContainer"><div class="progress-bar" id="pBar"></div></div>
        </div>

        <button class="btn" id="mainBtn" onclick="analyze()">Получить сигнал</button>
    </div>

</div>

<script>
    const marketData = [
        { pair: "USD/CAD OTC", profit: "87%" },
        { pair: "EUR/GBP OTC", profit: "85%" },
        { pair: "EUR/JPY OTC", profit: "85%" },
        { pair: "AUD/JPY OTC", profit: "81%" },
        { pair: "GBP/JPY OTC", profit: "81%" }
    ];

    const phases = [
        { text: "Анализируем волатильность рынка...", target: 18 },
        { text: "Фильтруем шумы OTC котировок...", target: 35 },
        { text: "Подбираем оптимальную валютную пару...", target: 58 },
        { text: "Сканируем объемы покупателей...", target: 72 },
        { text: "Ищем идеальную точку входа...", target: 91 },
        { text: "Формируем прогноз...", target: 100 }
    ];

    function startApp() {
        document.getElementById('welcomeScreen').classList.remove('active');
        document.getElementById('terminalScreen').classList.add('active');
    }

    function analyze() {
        const btn = document.getElementById('mainBtn');
        const line = document.getElementById('line');
        const status = document.getElementById('status');
        const dir = document.getElementById('direction');
        const infoRow = document.getElementById('infoRow');
        const pairText = document.getElementById('pair');
        const profitText = document.getElementById('profit');
        const pContainer = document.getElementById('pContainer');
        const pBar = document.getElementById('pBar');

        btn.disabled = true;
        dir.style.display = 'none';
        infoRow.style.display = 'none';
        pairText.innerText = "АНАЛИЗ РЫНКА...";
        
        line.style.opacity = '1';
        line.style.animation = 'scan 2s infinite linear';
        pContainer.style.display = 'block';
        pBar.style.width = '0%';

        let currentProgress = 0;
        let phaseIndex = 0;

        let interval = setInterval(() => {
            let rand = Math.random();
            let step = 0;
            
            if (rand > 0.85) {
                step = Math.floor(Math.random() * 8) + 4; 
            } else if (rand > 0.4) {
                step = Math.floor(Math.random() * 2) + 1; 
            } else {
                step = 0; 
            }

            currentProgress += step;
            if (currentProgress > 100) currentProgress = 100;

            pBar.style.width = currentProgress + '%';

            if (phaseIndex < phases.length && currentProgress >= phases[phaseIndex].target) {
                status.innerText = phases[phaseIndex].text;
                phaseIndex++;
            }

            if (currentProgress >= 100) {
                clearInterval(interval);
                setTimeout(showResult, 500);
            }
        }, 150); 

        function showResult() {
            line.style.animation = 'none';
            line.style.opacity = '0';
            pContainer.style.display = 'none';
            status.innerText = "Прогноз сформирован:";

            const selected = marketData[Math.floor(Math.random() * marketData.length)];
            pairText.innerText = selected.pair;
            profitText.innerText = selected.profit;

            const isUp = Math.random() > 0.5;
            dir.innerText = isUp ? "ВВЕРХ ⬆️" : "ВНИЗ ⬇️";
            dir.className = isUp ? "up" : "down";
            
            dir.style.display = 'block';
            infoRow.style.display = 'flex';
            
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
